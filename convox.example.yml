services:
  web:
    image: 691950705664.dkr.ecr.us-east-1.amazonaws.com/docspring/enterprise
    # domain: docspring.example.com
    health:
      path: ${HEALTH_CHECK_PATH}
      grace: 50
      interval: 5
    command: run_command deploy DATABASE_URL foreman start -m web=1
    deployment:
      minimum: 50
      maximum: 200
    # To see available CPU/RAM: convox api get /system/capacity
    scale:
      memory: 1400
      cpu: 600
      count: 3-6
      targets:
        cpu: 90
    environment:
      - "*"
      - WEB_CONCURRENCY=2
      - RAILS_MAX_THREADS=5
      - REQUEST_TIMEOUT=30
      - FORCE_SSL=true
      - PORT=4001
    port: 4001
    ingressAnnotations:
      - nginx.ingress.kubernetes.io/proxy-buffer-size=32k
    # No privileged containers. run_command starts as root with only the capabilities it needs: NET_ADMIN to add the
    # iptables rule that blocks the cloud metadata address, and SETUID and SETGID to switch to the deploy user. The app
    # then runs as deploy with no capabilities. Needs Convox 3.24.10 or later. worker and command use the same
    # securityContext.
    securityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop:
          - ALL
        add:
          - NET_ADMIN
          - SETUID
          - SETGID
      seccompProfile: RuntimeDefault

  worker:
    image: 691950705664.dkr.ecr.us-east-1.amazonaws.com/docspring/enterprise
    command: run_command deploy DATABASE_URL foreman start -m worker=1
    deployment:
      minimum: 50
      maximum: 200
    scale:
      memory: 2000
      cpu: 700
      count: 3-6
      targets:
        cpu: 90
    environment:
      - "*"
      - FORCE_SSL=true
    securityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop:
          - ALL
        add:
          - NET_ADMIN
          - SETUID
          - SETGID
      seccompProfile: RuntimeDefault

  command:
    image: 691950705664.dkr.ecr.us-east-1.amazonaws.com/docspring/enterprise
    command: echo "You can use this service to run rake tasks, rails console, etc."
    scale:
      memory: 512
      cpu: 250
      count: 0
    environment:
      - "*"
    securityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop:
          - ALL
        add:
          - NET_ADMIN
          - SETUID
          - SETGID
      seccompProfile: RuntimeDefault

timers:
  update-submissions:
    schedule: 0 3 * * ?
    command: run_command deploy DATABASE_URL rake submissions:expire_overdue_submissions
    service: command
